spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:${DB_HOST_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  auth:
    server-url: ${CATALOG_SERVER_URL}
    client-id: ${CATALOG_CLIENT_ID}
    client-secret: ${CATALOG_CLIENT_SECRET}
    redirect-uri: ${CATALOG_REDIRECT_URI}
    cookie-secure: ${CATALOG_COOKIE_SECURE:false}
    refresh-token-days: ${CATALOG_REFRESH_TOKEN_DAYS:7}

server:
  port: 8080
