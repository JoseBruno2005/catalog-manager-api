services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '${DB_HOST_PORT}:5432'
    volumes:
      - vl_manager_catalog:/var/lib/postgresql/data

volumes:
  vl_manager_catalog: